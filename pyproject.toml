[project]
name = "backoffice-agent"
version = "0.1.0"
description = "AI back-office agent pro poptávky stěhovací firmy"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.9.0",
    "fastapi>=0.165.0",
    "python-dotenv>=1.2.4",
    "python-telegram-bot>=22.8",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
