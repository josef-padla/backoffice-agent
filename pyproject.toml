[project]
name = "backoffice-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.9.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
backoffice-agent = "backoffice_agent:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
